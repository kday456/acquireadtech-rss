name: Daily deal signals

# Manual only for now. To run every morning, uncomment the schedule below
# (and, if you want the files committed to data/, add a commit step and
# grant `contents: write`).
on:
  workflow_dispatch:
    inputs:
      window_days:
        description: "Look-back window in days"
        default: "3"
  # schedule:
  #   - cron: "17 11 * * 1-5"   # 11:17 UTC on weekdays

permissions:
  contents: read

jobs:
  signals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acquireadtech-worker
    env:
      # Repository variable, e.g. "Digital Nations dealflow ops@yourdomain.com" (SEC fair-access policy).
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      # Optional LLM refinement. Off unless the DN_LLM_ENABLED variable is "1".
      DN_LLM_ENABLED: ${{ vars.DN_LLM_ENABLED }}
      DN_LLM_MAX_CALLS: ${{ vars.DN_LLM_MAX_CALLS }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install optional LLM SDK
        if: ${{ vars.DN_LLM_ENABLED == '1' }}
        run: npm install --no-save --omit=dev
      - run: node scripts/daily.js --out ../data --window "${{ inputs.window_days || '3' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: deal-signals
          path: data/
